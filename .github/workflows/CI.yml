name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
    branches:
      - main

# Permissions for documentation deployment
permissions:
  contents: write
  statuses: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1']
        os: ['ubuntu-latest']
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      # 1. Install uv and enable caching for faster runs
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 2. Install your target Python version
      - name: Set up Python
        run: uv python install 3.12

      # 3. Auto-setup the virtual environment for the tests
      - name: Create Python virtual environment
        run: |
          uv venv test/test_python/.venv
          uv pip install --python=test/test_python/.venv numpy pandas doubleml xgboost scikit-learn

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(workspace=true)'

      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Install Runic
        run: julia -e 'using Pkg; Pkg.add("Runic")'

      - name: Check formatting
        run: |
          julia -e '
            using Runic
            exit(Runic.main(["--check", "src", "test", "docs"]))
          '

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(workspace=true)'

      - name: Build and Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
